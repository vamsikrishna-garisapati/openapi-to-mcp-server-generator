name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: Build generated project from petstore
        run: |
          pnpm run generate -- --input tests/fixtures/openapi/petstore.yaml --output /tmp/petstore.zip
          mkdir -p /tmp/generated
          unzip -q /tmp/petstore.zip -d /tmp/generated
          cd /tmp/generated
          pnpm install
          pnpm run build

      - name: Docker build
        run: docker build .
