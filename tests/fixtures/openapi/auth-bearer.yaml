openapi: 3.0.3
info:
  title: Bearer Auth API
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - BearerAuth: []
paths:
  /profile:
    get:
      operationId: getProfile
      summary: Get user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
  /profile/settings:
    put:
      operationId: updateSettings
      summary: Update settings
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme:
                  type: string
                  enum:
                    - light
                    - dark
      responses:
        '200':
          description: Updated
